# 키즈노트 → 카카오톡 브리지 설정 예시
#   cp config.example.toml config.toml
#   cp .env.example .env   ← 토큰/비밀번호 같은 비밀값은 여기(.env)에만 둔다
# 알 수 없는 키를 쓰면 시작 시 오류로 알려 준다(오타 방지).

[server]
host = "127.0.0.1"          # 외부 노출은 Cloudflare Tunnel / Tailscale 로. 0.0.0.0 비권장
port = 8787
max_body_bytes = 65536
# webhook_token 은 .env 의 WEBHOOK_TOKEN 으로

[kakao]
enabled = true
redirect_uri = "http://localhost:8765/kakao/callback"   # Kakao Developers 에 똑같이 등록
token_file = "data/kakao_token.json"
link_url = "https://www.kidsnote.com"   # [앱 > 플랫폼 > Web] 사이트 도메인에 등록해야 링크가 열린다
button_title = "키즈노트 열기"
daily_limit = 100            # 자체 안전 상한(0=무제한). 넘으면 텔레그램으로
daily_token_refresh = true   # 하루 1번 갱신 → 리프레시 토큰 자동 연장
# rest_api_key / client_secret 은 .env 의 KAKAO_REST_API_KEY / KAKAO_CLIENT_SECRET 로

[telegram]
enabled = false              # 카카오 폴백. 켜려면 .env 에 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
daily_limit = 0

[delivery]
mode = "fallback"            # fallback: 앞 경로가 성공하면 끝 / broadcast: 모두에게
order = ["kakao", "telegram"]
tag = "키즈노트"
batch_window_seconds = 60    # 마지막 알림 후 60초 조용하면 묶어서 발송(앨범 10장 → 1개)
batch_max_wait_seconds = 300
max_messages_per_flush = 3   # 넘치면 '…외 N건'
low_quota_reserve = 10       # 남은 발송량이 10 이하이면 1시간 단위로 묶기
low_quota_batch_seconds = 3600
retry_base_seconds = 30
retry_max_seconds = 1800
max_queue_age_hours = 72

[rules]
timezone = "Asia/Seoul"
quiet_hours = "22:00-07:00"  # 이 시간엔 urgent 만 즉시, 나머지는 07:00 에 모아서. 끄려면 ""
urgent_bypass_quiet = true
digest_times = ["12:30", "19:00"]   # low(앨범·식단 등)는 이 시각에 모아서
exclude_keywords = ["광고", "이벤트"]
exclude_patterns = ['^\d+개의 새 (알림|메시지)$']   # 안드로이드 그룹 요약 알림 등
include_keywords = []        # 비어 있지 않으면 이 중 하나라도 있어야 통과
default_category = "기타"
default_priority = "normal"
use_default_categories = true   # 기본 유형(긴급/투약/귀가/결석/준비물/원복/행사/알림장/공지/일정/댓글/앨범/식단) 사용
allowed_packages = ["com.vaultmicro.kidsnote"]   # Play 스토어 URL 의 id= 값으로 확인
allowed_app_names = ["키즈노트", "kidsnote", "kids note"]

# 유형 추가/덮어쓰기: 같은 name 이면 기본값을 대체. 여러 유형에 걸리면 우선순위가 높은 쪽(urgent>normal>low).
# priority: urgent(즉시) | normal(짧게 묶음) | low(다이제스트) | mute(버림)
[[rules.categories]]
name = "앨범"
keywords = ["앨범", "사진", "동영상"]
priority = "low"

[[rules.categories]]
name = "식단"
keywords = ["식단"]
priority = "mute"

# 자녀별 설정(알림 문구에 이름/별칭이 있으면 해당 자녀로 판단)
[[rules.children]]
name = "지우"
aliases = ["김지우"]
enabled = true
mute_categories = []
# categories = ["투약", "귀가", "준비물"]   # 지정하면 이 유형만 받음

[email]
enabled = false              # 키즈노트가 메일 알림을 보낼 때만. 비밀번호는 .env 의 IMAP_PASSWORD(앱 비밀번호)
host = "imap.gmail.com"
port = 993
username = ""
mailbox = "INBOX"
from_filter = "kidsnote"
interval_seconds = 120

[web]
# [실험적] 키즈노트 웹 내부 API 폴링. 비공식이라 언제든 깨질 수 있고 약관 위반 소지가 있다.
# 비밀번호는 저장하지 않고 브라우저에서 복사한 Cookie 값(.env 의 KIDSNOTE_SESSION_COOKIE)만 쓴다.
enabled = false
base_url = "https://www.kidsnote.com"
interval_seconds = 900       # 최소 300
children = []                # 예: [{ id = "1234567", name = "지우" }]  ('web-children' 명령으로 찾기)
me_path = "/api/v1/me/info"

[[web.endpoints]]
kind = "알림장"
path = "/api/v1_2/children/{child_id}/reports/?page_size=10"

[storage]
path = "data/state.db"
dedup_hours = 72

[logging]
level = "INFO"
log_content = false          # true 면 알림 내용 일부를 로그에 남김(디버그 때만)
capture_samples = false      # true 면 원본 웹훅을 samples_file 에 저장 → 'check --file' 로 규칙 튜닝
samples_file = "data/samples.jsonl"

[monitor]
heartbeat_url = ""           # healthchecks.io 등 데드맨 스위치(브리지가 죽으면 그쪽에서 알림)
heartbeat_interval_seconds = 300
silence_alert_hours = 0      # 예: 72 → 사흘간 수집이 없으면 경고(폰 꺼짐/권한 해제 감지)
alert_cooldown_seconds = 21600
